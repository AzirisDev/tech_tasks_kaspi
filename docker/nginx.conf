# Reverse proxy: terminate HTTP on :80 and forward to the Flask app.
upstream flask_app {
    server app:5000;
}

server {
    listen 80;
    server_name _;

    # Access/error logs to stdout/stderr so `docker logs` sees them.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Proxy everything to the Flask upstream.
    location / {
        proxy_pass         http://flask_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Dedicated health location (same upstream endpoint) for nginx's own
    # healthcheck and external probes.
    location /health {
        proxy_pass http://flask_app/health;
        access_log off;
    }
}
