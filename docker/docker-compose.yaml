# =====================================================================
#  Full-stack local deployment: Flask + PostgreSQL + Redis + Nginx
#  Usage:
#    cp .env.example .env      # then edit secrets
#    docker compose up --build
#    curl http://localhost/          # via nginx -> flask
#    curl http://localhost/health
# =====================================================================
services:

  # ---------------- PostgreSQL ----------------
  db:
    image: postgres:14-alpine
    container_name: app-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

  # ---------------- Redis ----------------
  redis:
    image: redis:7-alpine
    container_name: app-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  # ---------------- Flask app ----------------
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: flask-microservice:1.0.0
    container_name: app-flask
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}
      REDIS_URL: redis://redis:6379/0
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - app-logs:/var/log/app
    networks:
      - appnet
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:5000/health',timeout=5).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    restart: unless-stopped

  # ---------------- Nginx reverse proxy ----------------
  nginx:
    image: nginx:1.27-alpine
    container_name: app-nginx
    ports:
      - "80:80"                       # only Nginx is exposed to the host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appnet
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    restart: unless-stopped

# ---------------- Volumes ----------------
volumes:
  postgres-data:
    driver: local
  app-logs:
    driver: local

# ---------------- Networks ----------------
networks:
  appnet:
    driver: bridge
