# Prometheus configuration (Task 7.1).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager (optional; wire up if you add alerts).
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:
  # ---- Prometheus self-monitoring ----
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---- Kubernetes API server ----
  - job_name: kubernetes-apiservers
    kubernetes_sd_configs:
      - role: endpoints
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels:
          [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

  # ---- Kubernetes nodes (kubelet / cAdvisor for CPU & memory) ----
  - job_name: kubernetes-nodes
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  # ---- Flask application (pods annotated with prometheus.io/scrape) ----
  - job_name: flask-app
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["devops-test"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod_name

  # ---- PostgreSQL via postgres_exporter ----
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
