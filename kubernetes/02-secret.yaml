# Sensitive values (Task 4.2). Values are base64-encoded as required.
# NOTE: base64 is encoding, not encryption — in real clusters use a
# sealed-secrets / external-secrets operator or SOPS. Committed here only
# because the task asks for a Secret manifest with base64 values.
#
#   echo -n 'change_me_in_prod' | base64   -> Y2hhbmdlX21lX2luX3Byb2Q=
#   echo -n 'redis_secret_pass' | base64   -> cmVkaXNfc2VjcmV0X3Bhc3M=
apiVersion: v1
kind: Secret
metadata:
  name: flask-secret
  namespace: devops-test
  labels:
    app: flask-app
type: Opaque
data:
  DATABASE_PASSWORD: Y2hhbmdlX21lX2luX3Byb2Q=
  REDIS_PASSWORD: cmVkaXNfc2VjcmV0X3Bhc3M=
