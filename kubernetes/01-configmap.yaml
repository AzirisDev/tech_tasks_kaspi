# Non-sensitive application configuration (Task 4.2).
apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-config
  namespace: devops-test
  labels:
    app: flask-app
data:
  LOG_LEVEL: "INFO"
  DEBUG: "false"
  APP_ENV: "production"
  # Service-DNS connection targets (non-secret parts).
  REDIS_URL: "redis://redis:6379/0"
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "appdb"
  DATABASE_USER: "appuser"
