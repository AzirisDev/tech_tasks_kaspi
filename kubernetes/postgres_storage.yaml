# PersistentVolume + Claim for PostgreSQL data (Task 4.3).
# 10Gi, ReadWriteOnce. The PV here uses hostPath for a single-node/demo
# cluster; in a cloud cluster you'd drop the PV and let a StorageClass
# dynamically provision (e.g. gp3/pd-ssd) against this same PVC.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  labels:
    app: postgres
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /mnt/data/postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: devops-test
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
